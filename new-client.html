<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database — New Client</title>
    <link rel="stylesheet" href="new-client.css">
</head>

<body>

<main class="intake-screen">

    <header class="header">
        <div class="brand">DATABASE</div>
        <div class="system-label">NEW CLIENT</div>
    </header>


    <!-- CLIENT -->

    <section class="data-panel active">

        <div class="panel-title">
            <h1>CLIENT</h1>
        </div>

        <div class="data-fields">

            <div class="field">
                <label for="firstName">FIRST NAME</label>
                <input type="text" id="firstName" autocomplete="given-name">
            </div>

            <div class="field">
                <label for="lastName">LAST NAME</label>
                <input type="text" id="lastName" autocomplete="family-name">
            </div>

            <div class="field">
                <label for="phone">PHONE</label>
                <input type="tel" id="phone" autocomplete="tel">
            </div>

            <div class="field">
                <label>EMAIL</label>

                <div class="email-input">
                    <input type="text" id="emailName">

                    <select id="emailDomain">
                        <option value="@gmail.com">@gmail.com</option>
                        <option value="@yahoo.com">@yahoo.com</option>
                        <option value="@hotmail.com">@hotmail.com</option>
                        <option value="@outlook.com">@outlook.com</option>
                        <option value="">OTHER</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>PREFERRED CONTACT</label>

                <div class="choice-group">
                    <button type="button" class="choice">CALL</button>
                    <button type="button" class="choice">TEXT</button>
                    <button type="button" class="choice">EMAIL</button>
                </div>
            </div>

        </div>

        <div class="navigation">
            <button type="button" class="primary-button">
                CONTINUE →
            </button>
        </div>

    </section>


    <!-- BOAT -->

    <section class="data-panel">

        <div class="panel-title">
            <h1>BOAT</h1>
        </div>

        <div class="data-fields">

            <div class="field">
                <label>BOAT TYPE</label>

                <div class="choice-group">
                    <button type="button" class="choice">V-HULL</button>
                    <button type="button" class="choice">PONTOON</button>
                    <button type="button" class="choice">OTHER</button>
                </div>
            </div>

            <div class="field">
                <label>MAKE</label>

                <div class="choice-group">
                    <button type="button" class="choice">DUFFY</button>
                    <button type="button" class="choice">ELECTRACRAFT</button>
                    <button type="button" class="choice">OTHER</button>
                </div>
            </div>

            <div class="field">
                <label for="boatModel">MODEL / CLASS</label>
                <input type="text" id="boatModel">
            </div>

            <div class="field">
                <label for="boatNotes">BOAT NOTES</label>
                <textarea id="boatNotes"></textarea>
            </div>

        </div>

        <div class="navigation">

            <button type="button" class="secondary-button">
                ← BACK
            </button>

            <button type="button" class="primary-button">
                CONTINUE →
            </button>

        </div>

    </section>


    <!-- LOCATION -->

    <section class="data-panel">

        <div class="panel-title">
            <h1>LOCATION</h1>
        </div>

        <div class="data-fields">

            <div class="field">
                <label for="community">COMMUNITY / LAKE</label>

                <select id="community">
                    <option value="">SELECT</option>
                    <option>Lake La Quinta</option>
                    <option>Tierra Lago</option>
                    <option>Motor Coach Country Club (MCC)</option>
                    <option>Speed Boat Lake</option>
                    <option>Laguna Del La Paz</option>
                    <option>Lake Mirage</option>
                    <option>Santo Tomas</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="field">
                <label for="city">CITY</label>

                <select id="city">
                    <option value="">SELECT</option>
                    <option>Indio</option>
                    <option>La Quinta</option>
                    <option>Rancho Mirage</option>
                    <option>Palm Desert</option>
                    <option>Palm Springs</option>
                    <option>Bermuda Dunes</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="field">
                <label for="address">STREET ADDRESS</label>
                <input type="text" id="address" autocomplete="street-address">
            </div>

            <div class="field">
                <label for="access">GATE / ACCESS</label>
                <textarea id="access"></textarea>
            </div>

        </div>

        <div class="navigation">

            <button type="button" class="secondary-button">
                ← BACK
            </button>

            <button type="button" class="primary-button">
                REVIEW →
            </button>

        </div>

    </section>


    <!-- REVIEW -->

    <section class="data-panel">

        <div class="panel-title">
            <h1>REVIEW</h1>
        </div>

        <div class="review-data">

            <div class="review-section">
                <h2>CLIENT</h2>
                <p id="reviewClient">—</p>
            </div>

            <div class="review-section">
                <h2>BOAT</h2>
                <p id="reviewBoat">—</p>
            </div>

            <div class="review-section">
                <h2>LOCATION</h2>
                <p id="reviewLocation">—</p>
            </div>

            <div class="review-section">
                <h2>ACCESS</h2>
                <p id="reviewAccess">—</p>
            </div>

        </div>

        <div class="navigation">

            <button type="button" class="secondary-button">
                ← BACK
            </button>

            <button type="button" class="primary-button">
                CREATE CLIENT RECORD
            </button>

        </div>

    </section>


    <footer class="footer">
        <span>DATABASE</span>
        <span>CLIENT RECORD</span>
    </footer>

</main>

<script src="new-client.js"></script>

</body>
</html>
