<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Services — Client Intake</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="intake-screen">

        <header class="header">
            <div class="brand">FALCON SERVICES</div>
            <div class="system-label">CLIENT INTAKE</div>
        </header>

        <section class="welcome">
            <p class="eyebrow">DESERT MARINE SERVICES</p>
            <h1>CLIENT INTAKE</h1>
        </section>

        <section class="choice-grid">

            <button class="choice-card" id="newClient">
                <span class="choice-number">01</span>
                <span class="choice-title">NEW CLIENT</span>
                <span class="choice-description">
                    Add a new client to the database.
                </span>
            </button>

            <button class="choice-card" id="existingClient">
                <span class="choice-number">02</span>
                <span class="choice-title">EXISTING CLIENT</span>
                <span class="choice-description">
                    Find a client already in the database.
                </span>
            </button>

        </section>

        <footer class="footer">
            <span>FALCON SERVICES</span>
            <span>INTAKE → DATABASE → COMMAND CENTER</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
